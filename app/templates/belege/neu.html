{% extends "base.html" %}
{% block title %}Neuer Beleg – {{ label }}{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Neuer Beleg: {{ label }}</h1>
<form method="post" action="/belege/{{ belegart }}/neu" class="col-lg-6">
  <div class="mb-3">
    <label class="form-label" for="adresse_id">Adresse</label>
    <select class="form-select" name="adresse_id" id="adresse_id" required>
      {% for adresse in adressen %}
      <option value="{{ adresse.id }}" {% if vorgewaehlte_adresse_id == adresse.id %}selected{% endif %}>{{ adresse.adressnr }} {{ adresse.firma }}{% if adresse.ort %} – {{ adresse.ort }}{% endif %}</option>
      {% endfor %}
    </select>
    {% if not adressen %}
    <div class="form-text text-danger">Keine passende Adresse vorhanden — bitte zuerst anlegen.</div>
    {% endif %}
  </div>
  <div class="mb-3">
    <label class="form-label" for="betreff">Betreff</label>
    <input class="form-control" type="text" name="betreff" id="betreff" maxlength="200"
           placeholder="z. B. Angebot Wartung Kompressor" autofocus>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label" for="datum">Datum</label>
      <input class="form-control" type="date" name="datum" id="datum" value="{{ heute.isoformat() }}">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label" for="termin">Termin</label>
      <input class="form-control" type="date" name="termin" id="termin">
    </div>
  </div>
  {% if belegart == 'auftrag' %}
  <div class="mb-3">
    <label class="form-label" for="auftragsart">Auftragsart</label>
    <select class="form-select" name="auftragsart" id="auftragsart">
      <option value="">– bitte wählen –</option>
      {% for a in auftragsarten %}
      <option value="{{ a }}">{{ auftragsart_labels[a] }}</option>
      {% endfor %}
    </select>
  </div>
  {% endif %}
  <div class="mb-3">
    <label class="form-label" for="kopftext">Kopftext</label>
    <textarea class="form-control" name="kopftext" id="kopftext" rows="3"></textarea>
  </div>
  <button class="btn btn-primary" type="submit" {% if not adressen %}disabled{% endif %}>Anlegen</button>
  <a class="btn btn-outline-secondary" href="{{ uebersicht_url }}">Abbrechen</a>
</form>
{% endblock %}
