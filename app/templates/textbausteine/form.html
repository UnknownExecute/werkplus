{% extends "base.html" %}
{% block title %}{% if neu %}Neuer Textbaustein{% else %}{{ baustein.titel }}{% endif %}{% endblock %}
{% block content %}
<h1 class="h3 mb-4">{% if neu %}Neuer Textbaustein{% else %}Textbaustein bearbeiten{% endif %}</h1>
{% if fehler %}<div class="alert alert-danger">{{ fehler }}</div>{% endif %}
<form method="post" action="{% if neu %}/textbausteine/neu{% else %}/textbausteine/{{ baustein.id }}{% endif %}" class="col-lg-9">
  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label" for="kuerzel">Kürzel</label>
      <input class="form-control" id="kuerzel" name="kuerzel" value="{{ baustein.kuerzel }}"
             placeholder="z. B. AGB1">
    </div>
    <div class="col-md-8">
      <label class="form-label" for="titel">Titel</label>
      <input class="form-control" id="titel" name="titel" value="{{ baustein.titel }}" required>
    </div>
    <div class="col-md-4">
      <label class="form-label" for="kategorie">Kategorie</label>
      <select class="form-select" id="kategorie" name="kategorie">
        {% for wert, label in kategorie_labels.items() %}
        <option value="{{ wert.value }}"{% if baustein.kategorie == wert %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-12">
      <label class="form-label" for="text">Text</label>
      <textarea class="form-control" id="text" name="text" rows="6">{{ baustein.text }}</textarea>
    </div>
    <div class="col-12">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="aktiv" name="aktiv" value="true"
               {% if baustein.aktiv %}checked{% endif %}>
        <label class="form-check-label" for="aktiv">Aktiv</label>
      </div>
    </div>
  </div>
  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Speichern</button>
    <a class="btn btn-outline-secondary" href="/textbausteine">Abbrechen</a>
  </div>
</form>
{% endblock %}
