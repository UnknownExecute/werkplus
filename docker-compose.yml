services:
  werkplus:
    build: .
    image: werkplus:latest
    container_name: werkplus
    restart: unless-stopped
    ports:
      # Host-Port 9999 → Container 8000. Direktzugriff: http://<NAS-IP>:9999
      # (davor liegt üblicherweise der Synology-Reverse-Proxy für Name/HTTPS).
      - "9999:8000"
    volumes:
      # Persistente SQLite-Datenbank (überlebt Container-Updates)
      - ./data:/data
      # Bug-Melder-Screenshots dauerhaft sichern
      - ./data/bugreports:/werkplus/app/static/bugreports
    env_file:
      - .env
    environment:
      # WERKPLUS_ENV=production erzwingt einen sicheren Secret-Key (siehe .env)
      WERKPLUS_ENV: "production"
    # Zustandsprüfung über GET /health (ohne Login erreichbar, prüft die Datenbank).
    # Kein curl im Slim-Image — daher der Python-Aufruf; urlopen wirft bei 503,
    # der Exit-Code wird dann != 0 und der Container gilt als "unhealthy".
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      # Erststart braucht Zeit für Alembic-Migration und Produktions-Init.
      start_period: 60s
