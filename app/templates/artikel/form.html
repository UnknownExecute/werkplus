{% extends "base.html" %}
{% block title %}Neuer Artikel{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Neuer Artikel</h1>
{% if fehler %}<div class="alert alert-danger">{{ fehler }}</div>{% endif %}
<form method="post" action="/artikel/neu" class="col-lg-9" data-kalk-form>
  {% include "partials/artikel_formularfelder.html" %}
  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Speichern</button>
    <a class="btn btn-outline-secondary" href="/artikel">Abbrechen</a>
  </div>
</form>
{% endblock %}
