{% extends "base.html" %}
{% block title %}Bestandskorrektur{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Bestandskorrektur</h1>
  <a class="btn btn-outline-secondary" href="/lager/bewegungen">Zum Journal</a>
</div>

{% if fehler %}<div class="alert alert-danger">{{ fehler }}</div>{% endif %}

<form method="post" action="/lager/korrektur" class="col-lg-8">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label" for="artikel_id">Artikel (Lagerartikel) *</label>
      <select class="form-select" id="artikel_id" name="artikel_id" required>
        <option value="">– bitte wählen –</option>
        {% for artikel in artikel_liste %}
        <option value="{{ artikel.id }}">{{ artikel.artikelnr }} – {{ artikel.bezeichnung }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="lager_id">Lager *</label>
      <select class="form-select" id="lager_id" name="lager_id" required>
        {% for lager in lager_liste %}
        <option value="{{ lager.id }}"
                {% if lager.id == standard_lager_id %}selected{% endif %}>{{ lager.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="korrekturart">Korrekturart</label>
      <select class="form-select" id="korrekturart" name="korrekturart">
        <option value="absolut">Absolut (neuer Bestand)</option>
        <option value="differenz">Differenz (+/- Menge)</option>
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="menge">Menge</label>
      <input class="form-control" type="text" id="menge" name="menge" value="0" inputmode="decimal">
      <div class="form-text">
        Bei „Absolut“ der neue Zielbestand, bei „Differenz“ eine vorzeichenbehaftete
        Menge (z. B. -2 oder 5).
      </div>
    </div>
    <div class="col-12">
      <label class="form-label" for="grund">Grund / Notiz</label>
      <input class="form-control" type="text" id="grund" name="grund"
             placeholder="z. B. Inventurdifferenz, Bruch, Schwund">
    </div>
  </div>
  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Korrektur buchen</button>
    <a class="btn btn-outline-secondary" href="/lager/bewegungen">Abbrechen</a>
  </div>
</form>
{% endblock %}
