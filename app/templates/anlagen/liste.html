{% extends "base.html" %}
{% block title %}Anlagen{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Anlagen</h1>
  <a class="btn btn-primary" href="/anlagen/neu">Neue Anlage</a>
</div>

<div class="row mb-3 align-items-center g-2">
  <div class="col-md-5">
    <input class="form-control" type="search" name="q" value="{{ q }}"
           placeholder="Suche: Kunde, Artikel, SN, Standort …"
           hx-get="/anlagen/suche?wartung={{ wartung }}" hx-trigger="input changed delay:300ms"
           hx-target="#anlagen-tabelle" autofocus>
  </div>
  <div class="col-md-auto">
    <div class="btn-group" role="group">
      <a class="btn btn-outline-secondary {% if wartung != 'faellig' %}active{% endif %}"
         href="/anlagen">Alle</a>
      <a class="btn btn-outline-secondary {% if wartung == 'faellig' %}active{% endif %}"
         href="/anlagen?wartung=faellig">Wartung fällig</a>
    </div>
  </div>
</div>

<table class="table table-hover tabelle-kompakt">
  <thead>
    <tr>
      <th>Kunde</th>
      <th>Artikel</th>
      <th>SN</th>
      <th>Standort</th>
      <th>Inbetriebnahme</th>
      <th>Garantieende</th>
      <th>Nächste Wartung</th>
    </tr>
  </thead>
  <tbody id="anlagen-tabelle">
    {% include "partials/anlagen_zeilen.html" %}
  </tbody>
</table>
{% endblock %}
