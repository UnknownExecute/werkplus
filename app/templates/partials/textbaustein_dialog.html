<div class="card card-body mt-2 mb-2">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <strong class="small">Textbaustein einf&uuml;gen</strong>
    <button type="button" class="btn-close" aria-label="Schlie&szlig;en"
            onclick="document.getElementById('{{ dialog_id }}').innerHTML=''"></button>
  </div>
  {% if not bausteine %}
  <p class="text-muted small mb-0">Keine Textbausteine vorhanden.</p>
  {% else %}
  <div class="list-group">
    {% for b in bausteine %}
    <form action="{{ aktion_url }}" method="post" class="mb-0"
          {% if verwende_htmx %}hx-post="{{ aktion_url }}" hx-target="{{ ziel_target }}" hx-swap="outerHTML"{% endif %}>
      <input type="hidden" name="baustein_id" value="{{ b.id }}">
      {% for k, v in extra.items() %}
      <input type="hidden" name="{{ k }}" value="{{ v }}">
      {% endfor %}
      <button type="submit" class="list-group-item list-group-item-action text-start w-100">
        <span class="fw-medium">{{ b.titel or b.kuerzel or 'Textbaustein' }}</span>
        {% if b.kuerzel %}<span class="badge bg-secondary ms-1">{{ b.kuerzel }}</span>{% endif %}
        <div class="small text-muted text-truncate">{{ b.text }}</div>
      </button>
    </form>
    {% endfor %}
  </div>
  {% endif %}
</div>
